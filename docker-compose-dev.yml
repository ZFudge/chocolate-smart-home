networks:
  csm-network-dev:
    name: csm-network-dev

volumes:
  csm-postgres-vol-dev:
    driver: local
  csm-redis-data-dev:
    driver: local

x-csm-network: &csm-network
  networks:
    - csm-network-dev

x-common-attrs: &common-attrs
  env_file: backend/.env
  << : *csm-network

x-environment-variables: &environment-variables
  BACKEND_STREAM_NAME: csm-backend-stream-dev
  DB_HOST: csm-postgres-db-dev
  LOG_SUFFIX: -dev
  MQTT_CLIENT_ID: CSM-FASTAPI-SERVER-DEV
  MQTT_HOST: csm-mqtt-dev
  REDIS_HOST: csm-redis-dev
  WEBSOCKETS_STREAM_NAME: csm-websockets-stream-dev

services:
  csm-mosquitto-dev:
    image: eclipse-mosquitto:2.0.20
    container_name: csm-mosquitto-dev
    << : *csm-network
    volumes:
      - /tmp/csm-logs/:/mosquitto/log/
      - ./backend/mosquitto/mosquitto-dev.conf:/mosquitto/config/mosquitto.conf
      - ./backend/mosquitto/conf.d/:/mosquitto/config/conf.d/
      - ./backend/scripts/mqtt_healthcheck.sh:/usr/local/bin/healthcheck.sh
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: always
  csm-postgres-db-dev:
    image: postgres:12.18-bullseye
    container_name: csm-postgres-db-dev
    << : *common-attrs
    ports:
      - 15432:5432
    volumes:
      - csm-postgres-vol-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
  csm-redis-dev:
    image: redis:7.4.1-alpine
    container_name: csm-redis-dev
    << : *common-attrs
    ports:
      - 6379:6379
    volumes:
      - csm-redis-data-dev:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
  csm-backend-dev:
    image: csm-backend:dev
    container_name: csm-backend-dev
    build:
      context: backend/
      target: csm-backend
    << : *common-attrs
    environment:
      << : *environment-variables
    ports:
      - 8000:8000
    volumes:
      - /tmp/csm-logs/:/var/logs/csm/
      - ./backend/:/backend/
    command: [
      "uvicorn", "src.main:app",
      "--host", "0.0.0.0",
      "--log-config", "logs.ini",
      "--log-level", "debug",
      "--reload",
      "--reload-exclude", "src/plugins/device_plugins/*/scheduling.py",
      "--reload-exclude", "src/plugins/virtual_clients/*",
      "--reload-exclude", "src/scheduler/*",
      "--reload-exclude", "test_*.py",
    ]
    depends_on:
      csm-postgres-db-dev:
        condition: service_healthy
      csm-mosquitto-dev:
        condition: service_healthy
      csm-redis-dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -i http://localhost:8000/healthcheck | grep '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
  csm-scheduler-dev:
    image: csm-backend:dev
    container_name: csm-scheduler-dev
    << : *common-attrs
    environment:
      << : *environment-variables
    ports:
      - 8100:8100
    volumes:
      - /tmp/csm-logs/:/var/logs/csm/
      - ./backend/:/backend/
    command: [
      "uvicorn", "src.scheduler.sched_app:sched_app",
      "--host", "0.0.0.0",
      "--port=8100",
      "--log-config", "logs.ini",
      "--log-level", "debug",
      "--reload",
      "--reload-include", "src/scheduler/",
      "--reload-include", "src/plugins/device_plugins/**/scheduling.py",
    ]
    depends_on:
      csm-mosquitto-dev:
        condition: service_healthy
      csm-postgres-db-dev:
        condition: service_healthy
      csm-backend-dev:
        condition: service_healthy
      csm-redis-dev:
        condition: service_healthy
  virtual-clients:
    image: csm-backend:dev
    container_name: virtual-clients
    << : *common-attrs
    volumes:
      - /tmp/csm-logs/:/var/logs/csm/
      - ./backend/:/backend/
    command: [
      "uvicorn", "src.plugins.virtual_clients.vcs_app:vcs_manager",
      "--port=8200",
      "--log-config", "logs.ini",
      "--log-level", "debug",
      "--reload",
      "--reload-dir", "src/plugins/virtual_clients/",
    ]
    depends_on:
      csm-mosquitto-dev:
        condition: service_healthy
      csm-postgres-db-dev:
        condition: service_healthy
      csm-backend-dev:
        condition: service_healthy
      csm-redis-dev:
        condition: service_healthy
    environment:
      MQTT_CLIENT_ID_PREFIX: virtual-clients
      LOGGER: vcs
      << : *environment-variables
  csm-websockets-dev:
    image: csm-websockets:dev
    container_name: csm-websockets-dev
    build: ./ws-service/
    working_dir: /csm-websockets/
    << : *csm-network
    environment:
      << : *environment-variables
    ports:
      - 8050:8050
    volumes:
      - /tmp/csm-logs/:/var/logs/
      - ./ws-service/:/csm-websockets/
    command: [
      "uvicorn", "src.ws_app:app",
      "--host", "0.0.0.0",
      "--port", "8050",
      "--log-level", "debug",
      "--log-config", "logs.ini",
      "--reload",
      "--reload-dir", "src",
    ]
    depends_on:
      csm-backend-dev: # healthcheck websocket connect triggers a request for all data, which relays through redis to the backend
        condition: service_healthy
      csm-redis-dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -v -s --max-time=1 ws://localhost:8050/ws 2>&1 | grep 'Operation timed out'"]
      interval: 1m
      start_period: 5s
      start_interval: 5s
      timeout: 5s
      retries: 5
    restart: always
  csm-nginx-dev:
    image: nginx:1.27.4
    container_name: csm-nginx-dev
    << : *common-attrs
    volumes:
      - type: bind
        source: nginx/development.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: ./frontend/dist
        target: /usr/share/nginx/html
        read_only: true
    depends_on:
      csm-backend-dev:
        condition: service_healthy
      csm-websockets-dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s -v -i http://localhost/ 2>&1 | grep '200 OK'"]
      interval: 1h
      start_period: 5s
      start_interval: 5s
      timeout: 5s
      retries: 5
    restart: always
  csm-frontend-dev:
    image: node:22.13.0-alpine
    container_name: csm-frontend-dev
    working_dir: /frontend
    << : *common-attrs
    ports:
      - 15173:15173
      - 16006:6006
    volumes:
      - ./frontend/:/frontend/
    command: ["npm", "run", "dev"]
    depends_on:
      csm-nginx-dev:
        condition: service_healthy
    restart: always
